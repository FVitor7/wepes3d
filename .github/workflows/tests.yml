# Runs the test suite on every push to main and on every pull request.
# Two Python versions: the oldest one we support and the newest one.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # if one version fails, the other still runs
      matrix:
        python-version: ["3.9", "3.x"]   # 3.x = the newest stable Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      # Coverage is turned on in pyproject.toml; the job fails below 95%.
      - run: python -m pytest --cov-fail-under=95
