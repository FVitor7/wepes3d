# TEST / development settings.
#
# IMPORTANT: the package itself (runtime) still has NO external dependencies —
# it only uses the Python standard library (struct, zlib, math, argparse...).
# The dependencies below are ONLY for running the test suite (pytest + coverage).
# Install them with:  pip install -r requirements-dev.txt

[tool.pytest.ini_options]
minversion = "7.0"
# The suite measures coverage by default. `pythonpath = ["."]` puts the
# repository root on sys.path, so `import wepes3d` also works with plain
# `pytest` (`python -m pytest` already does this by itself).
addopts = "-q --cov=wepes3d --cov-report=term-missing --cov-branch"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["wepes3d"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Lines that do not count as "not covered" (entry points and safety checks).
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
